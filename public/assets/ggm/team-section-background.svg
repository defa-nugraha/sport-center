  <path d="M0 520 C170 530 260 555 380 570 C520 590 640 570 760 585 C1000 600 1180 630 1320 650 L1850 650 L0 650 Z" fill="#00c8df"/>
  <!-- Coral field overlaps the blue and cyan layers so no white seams appear between them. -->
