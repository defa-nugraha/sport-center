  <path d="M1850 80 C1640 112 1460 166 1350 250 C1270 312 1298 386 1375 450 C1460 522 1595 582 1735 624 L1850 650 Z" fill="#ffad35"/>
  <!-- Blue left field overlaps the coral edge and flows into the bottom wave. -->
  <path d="M0 236 C208 257 397 298 546 362 C653 408 718 461 713 505 C706 571 547 613 360 625 C227 633 96 607 0 571 Z" fill="#4d70d3"/>
  <!-- Pink pointer accents the space below the middle profiles. -->
